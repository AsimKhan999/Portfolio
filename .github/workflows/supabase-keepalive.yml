name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ secrets.SUPABASE_URL }}/rest/v1/site_settings?select=id&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Supabase project is awake."
              exit 0
            fi
            sleep 30
          done
          echo "::warning::All keep-alive attempts failed - check SUPABASE_URL/SUPABASE_ANON_KEY secrets."
          exit 1
